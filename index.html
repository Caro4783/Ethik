<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seite erstellen</title>
    <style>
        body {
            background-color: #1c1c1c;
            color: white;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        .form-container {
            background: #232323;
            padding: 10px;
            border-radius: 0px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            margin: 50px auto;
            border: 1px solid #4f545c;
        }
        .form-container h2 {
            text-align: center;
            color: #7289d;
            margin-bottom: 20px;
            border-bottom: 1px solid #4f545c;
            padding-bottom: 10px;
        }
        .form-container input,
        .form-container select,
        .form-container textarea {
            width: calc(100% - 20px);
            padding: 10px;
            margin: 10px 10px;
            border: 1px solid #4f545c;
            border-radius: 2px;
            box-sizing: border-box;
            background-color: #23272a;
            color: white;
        }
        .form-container button {
            width: calc(100% - 20px);
            padding: 10px;
            margin: 10px 10px;
            background-color: #397fa8;
            border: 1px solid #4f545c;
            border-radius: 2px;
            color: white;
            cursor: pointer;
            box-sizing: border-box;
        }
        .form-container button:hover {
            background-color: #4896c4;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Ethik Dokumentenverarbeitung Bee™</h2>
        <form action="create_page.php" method="post">
            <input type="text" name="page_name" placeholder="Dokumentname" required>
            <input type="text" name="docs_link" placeholder="Google Docs Link" required>
            <input type="text" name="username" placeholder="Nutzername" required>
            <input type="password" name="password" placeholder="Passwort" required>
            <select name="status" required>
                <option value="Angenommen">Angenommen</option>
                <option value="Abgelehnt">Abgelehnt</option>
                <option value="Ab ins KB">Ab ins KB</option>
            </select>
            <textarea name="auflagen" placeholder="Auflagen" required></textarea>
            <button type="submit">Seite erstellen</button>
        </form>
    </div>
</body>
</html>
